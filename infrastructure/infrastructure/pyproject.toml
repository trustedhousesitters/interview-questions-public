[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "petmatch-infra"
requires-python = ">= 3.11"
version = "1.0.0"

dependencies = [
    "pulumi>=3.0.0,<5.0.0",
    "pulumi-aws>=6.0.0,<7.0.0",
    "pydantic>=2.6.0,<3.0.0",
]

[tool.setuptools.package-dir]
"pm_infra" = "package"
